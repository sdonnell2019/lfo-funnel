# Static site. No build step. Netlify serves the repo as-is.
[build]
  publish = "."
  command = ""

# Short aliases so ad links can be tidy.
[[redirects]]
  from = "/apply"
  to = "/viral/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/calendar/"
  status = 301

# Long-cache the versioned assets, never cache the HTML, so a deploy is
# visible immediately but repeat visitors do not refetch CSS/JS.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
